# Paste into waves.yaml as a new wave right after W16 (before W17). Not applied automatically:
# your local waves.yaml may be ahead of GitHub and the orkiestra state is keyed by task id.
- id: PK-00
  tasks:
  - id: PK-00
    title: 'PK-00: Per-feature files for validation, mock and contracts'
    prompt_file: docs/prompts/PK-00-per-feature-files.md
    files:
    - src/Cuy.Core/Input/MessageValidator.cs
    - src/Cuy.Core/Input/IMessageRuleSet.cs
    - tests/Cuy.Core.Tests/MessageValidatorTests.cs
    - web/home/bridge.js
    - web/home/app.js
    - web/home/features/README.md
    - tools/qa/web-smoke.js
    test_command: dotnet test tests/Cuy.Core.Tests/Cuy.Core.Tests.csproj -c Release --filter FullyQualifiedName~MessageValidatorTests
      && node --check web/home/bridge.js && node --check web/home/app.js && node tools/qa/web-smoke.js
    model: gemini-3.8-flash-high
    timeout_minutes: 40
