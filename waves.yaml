version: 1
waves:
- id: w-validation-tests
  tasks:
  - id: data-ranges
    title: Dodaj testy walidacji danych DataValidationTests
    files:
    - tests/Cuy.Core.Tests/DataValidationTests.cs
    test_command: dotnet test tests/Cuy.Core.Tests/Cuy.Core.Tests.csproj -c Release
      --filter FullyQualifiedName~DataValidationTests
    prompt: 'Create tests/Cuy.Core.Tests/DataValidationTests.cs.

      Ensure that every JSON file in assets/data/*.json parses successfully,

      item and need IDs conform to canonical IDs in AGENTS.md,

      and every item has an icon in assets/icons/icons.json.

      Do not modify data files.

      '
  - id: sim-assertions
    title: Dodaj test deterministyczności symulatora
    files:
    - tests/Cuy.Core.Tests/SimulationDeterminismTests.cs
    test_command: dotnet test tests/Cuy.Core.Tests/Cuy.Core.Tests.csproj -c Release
      --filter FullyQualifiedName~SimulationDeterminismTests
    prompt: 'Create tests/Cuy.Core.Tests/SimulationDeterminismTests.cs.

      Run a 30-day simulation twice using the same seed and assert identical outcomes.

      '
- id: w-perf-tests
  tasks:
  - id: perf-test
    title: Dodaj test wydajności pętli decyzji BrainPerfTests
    files:
    - tests/Cuy.Core.Tests/BrainPerfTests.cs
    test_command: dotnet test tests/Cuy.Core.Tests/Cuy.Core.Tests.csproj -c Release
      --filter FullyQualifiedName~BrainPerfTests
    prompt: 'Create tests/Cuy.Core.Tests/BrainPerfTests.cs.

      Execute 10,000 ticks of Brain with ManualClock and a fixed Random seed.

      Assert execution time is under 2.0 seconds and no exceptions are thrown.

      Do not modify production code.

      '
  - id: fuzz-test
    title: Dodaj test NoPolishIdsTests
    files:
    - tests/Cuy.Core.Tests/NoPolishIdsTests.cs
    test_command: dotnet test tests/Cuy.Core.Tests/Cuy.Core.Tests.csproj -c Release
      --filter FullyQualifiedName~NoPolishIdsTests
    prompt: 'Create tests/Cuy.Core.Tests/NoPolishIdsTests.cs.

      Verify that Polish identifiers (from docs/NAMES.md) appear only in Save/SaveSystem.cs

      and nowhere else in src/Cuy.Core or src/Cuy.

      '
- id: w-backlog-cleanup
  tasks:
  - id: xml-docs-ai
    title: Dodaj komentarze XML do klas AI
    files:
    - src/Cuy.Core/AI/Brain.cs
    - src/Cuy.Core/AI/IAction.cs
    - src/Cuy.Core/AI/Actions/EatAction.cs
    - src/Cuy.Core/AI/Actions/PlayAction.cs
    - src/Cuy.Core/AI/Actions/RestAction.cs
    - src/Cuy.Core/AI/Actions/WanderAction.cs
    test_command: dotnet build src/Cuy.Core/Cuy.Core.csproj -c Release
    prompt: Add short English XML doc comments (/// <summary>) to public classes in
      src/Cuy.Core/AI/ (Brain, IAction, EatAction, PlayAction, RestAction, WanderAction).
      Do not modify logic.
  - id: arch-doc-refresh
    title: Odśwież ARCHITECTURE.md
    files:
    - ARCHITECTURE.md
    test_command: git diff --stat
    prompt: Refresh ARCHITECTURE.md with current modules and features based on current
      code. Update documentation only.
  - id: testing-docs-unify
    title: Ujednolić dokumentację testów
    files:
    - docs/TESTY_RECZNE.md
    - docs/TESTING.md
    test_command: git diff --stat
    prompt: Clarify roles of docs/TESTY_RECZNE.md (manual Windows checklist) and docs/TESTING.md
      (automated tests) with cross-links. Remove duplicates and keep documentation
      consistent.
