<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cuy Games</title>
  <meta name="description" content="Phaser 3 minigame framework for Cuy's Home.">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="minigames.css">
  <style>
    body {
      padding: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: var(--ui-plum-0);
    }
    .minigames-standalone-device {
      width: 100%;
      max-width: 420px;
      background: var(--ui-linen-2);
      border: 4px solid var(--ui-wood-0);
      border-radius: 12px;
      box-shadow: 
        0 10px 0 var(--ui-plum-0),
        0 16px 24px rgba(0,0,0,0.4),
        inset 3px 3px 0 var(--ui-linen-3),
        inset -3px -3px 0 var(--ui-linen-1);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .standalone-header {
      background: var(--ui-wood-2);
      border-bottom: 3px solid var(--ui-wood-0);
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--ui-linen-3);
    }
    .standalone-title {
      font-size: 15px;
      font-weight: 700;
    }
    .standalone-body {
      padding: 12px;
      min-height: 400px;
    }
  </style>
</head>
<body>

  <main class="minigames-standalone-device">
    <header class="standalone-header">
      <span class="standalone-title">GAMES WITH CUY</span>
      <a href="../index.html" style="color:var(--ui-hay-2); text-decoration:none; font-weight:700; font-size:12px;">Home</a>
    </header>

    <div class="standalone-body" id="minigamesContainer">
      <!-- Game selection or the active game -->
    </div>
  </main>

      <!-- Bridge and sound scripts from Home -->
  <script src="../bridge.js"></script>
  <script src="../sound.js"></script>

  <!-- Pinned Phaser 3.80.1 -->
  <script src="lib/phaser.min.js"></script>

      <!-- Shared API and minigame framework -->
  <script src="minigames-api.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('minigamesContainer');
      if (window.Minigry && container) {
        window.Minigry.renderSelectScreen(container);
      }
    });
  </script>
</body>
</html>
