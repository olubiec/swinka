[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orkiestra"
version = "0.1.0"
description = "Wave runner for Antigravity agy agents"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
orkiestra = "orkiestra.cli:main"

[tool.setuptools]
packages = ["orkiestra", "orkiestra.templates"]

[tool.setuptools.package-data]
"orkiestra.templates" = ["*.md", "*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
